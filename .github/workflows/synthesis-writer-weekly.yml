name: VisiPilot Synthesis Writer — Weekly

# ==========================================================================
# Friday 08:30 PARIS — runs ~30 min after the weekly builder commits at 08:00
# Paris. That window covers: builder build (~5 min) + commit (~30s) + Vercel
# deploy (~10 min) + buffer. By 08:30 the new weekly-summary-latest.json is
# live with ai_lead_paragraph="" ready to be filled.
#
# Timeline each Friday (all Paris time):
#   08:00  VisiPilot Weekly Report builds + commits weekly-summary-latest.json
#          (ai_lead_paragraph="")
#   08:30  THIS WORKFLOW → reads the JSON, generates synthesis via LLM,
#          writes ai_lead_paragraph back, commits.
#   09:00  Mailer review preview fires (Apps Script, Athens time) → the
#          reviewer sees the synthesis in the [REVIEW] email body.
#   12:30  Mailer mass send → subscribers see the Intelligence Summary
#          section populated.
#
# Native cron below (no longer dependent on FsisScheduler.gs).
#
# Failure posture: if synthesis fails (LLM down, rate-limited, deterministic
# fallback also crashes), the field stays "" and the mailer cleanly skips
# the Intelligence Summary block — subscribers get the email anyway.
# ==========================================================================

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Overwrite existing ai_lead_paragraph if already populated"
        required: false
        default: "false"
  schedule:
    # Friday 08:30 Paris — winter (CET, UTC+1) → Fri 07:30 UTC
    - cron: "30 7 * 1,2,3,11,12 5"
    # Friday 08:30 Paris — summer (CEST, UTC+2) → Fri 06:30 UTC
    - cron: "30 6 * 4,5,6,7,8,9,10 5"

permissions:
  contents: write

concurrency:
  group: fsis-data-writers
  cancel-in-progress: false

jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Paris-time guard
        id: guard
        run: |
          HOUR=$(TZ=Europe/Paris date +%H)
          MIN=$(TZ=Europe/Paris date +%M)
          DOW=$(TZ=Europe/Paris date +%u)   # 1=Mon .. 7=Sun
          echo "paris=${HOUR}:${MIN} dow=${DOW}"
          # Manual dispatch is always allowed; scheduled dispatch is gated.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "manual=1 (skipping guard)"
            echo "run=1" >> "$GITHUB_OUTPUT"
          else
            # Must be Friday between 08:00 and 11:59 Paris
            if [ "$DOW" = "5" ] && [ "$HOUR" -ge "08" ] && [ "$HOUR" -lt "12" ]; then
              echo "run=1" >> "$GITHUB_OUTPUT"
            else
              echo "run=0" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Checkout
        if: steps.guard.outputs.run == '1'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        if: steps.guard.outputs.run == '1'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        if: steps.guard.outputs.run == '1'
        run: |
          python -m pip install --upgrade pip
          pip install requests google-genai openpyxl

      - name: Git identity (for commit)
        if: steps.guard.outputs.run == '1'
        run: |
          git config user.name  "visipilot-bot"
          git config user.email "visipilot-bot@users.noreply.github.com"

      - name: Run synthesis writer
        if: steps.guard.outputs.run == '1'
        env:
          CLAUDE_API_KEY:       ${{ secrets.CLAUDE_API_KEY }}
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY_FREE:  ${{ secrets.GEMINI_API_KEY_FREE }}
          GEMINI_API_KEY_1:     ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2:     ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3:     ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4:     ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5:     ${{ secrets.GEMINI_API_KEY_5 }}
          GROQ_API_KEY:         ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python -m pipeline.synthesis_writer --cadence weekly --force
          else
            python -m pipeline.synthesis_writer --cadence weekly
          fi

      - name: Skip note
        if: steps.guard.outputs.run != '1'
        run: |
          echo "Outside the Friday 08:00-11:59 Paris window — skipping."
